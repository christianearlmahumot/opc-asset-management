server:
  port: ${PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: fams-api
  config:
    # Secrets (DB password, JWT secret, admin password) live in backend/.env, which is git-ignored.
    import: optional:file:.env[.properties]
  datasource:
    # Local default matches docker-compose.yml. Supabase values come from backend/.env.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fams}
    username: ${DB_USER:fams}
    password: ${DB_PASSWORD:fams}
    hikari:
      maximum-pool-size: 5   # Supabase free plan allows only a few connections
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks that entities match it
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Manila
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

fams:
  storage:
    # Development file storage (asset photos, scans). Replaced by Supabase Storage at deploy (Step 9).
    local-dir: ${STORAGE_DIR:uploads}
  jwt:
    # Must be at least 32 characters. Always override JWT_SECRET outside local development.
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    # Creates the first Administrator only when the app_user table is empty.
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:System Administrator}
