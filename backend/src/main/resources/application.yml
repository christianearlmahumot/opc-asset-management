server:
  port: ${PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: fams-api
  config:
    # Secrets (DB password, JWT secret, admin password) live in backend/.env, which is git-ignored.
    import: optional:file:.env[.properties]
  datasource:
    # Local default matches docker-compose.yml. Supabase values come from backend/.env.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fams}
    username: ${DB_USER:fams}
    password: ${DB_PASSWORD:fams}
    hikari:
      maximum-pool-size: 5   # Supabase free plan allows only a few connections
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks that entities match it
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Manila
  flyway:
    enabled: true
    locations: classpath:db/migration
    # A new Supabase project is not empty: Supabase puts its own helper objects in "public".
    # Baseline at version 0 so Flyway accepts it and still runs every migration from V1.
    # It does nothing on a database that already has a flyway_schema_history table.
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

fams:
  storage:
    # Where asset photos, scans and PDFs are kept: "local" (folder on disk, for development) or
    # "supabase" (private Supabase Storage bucket, required on Render, whose disk is wiped on deploy).
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_DIR:uploads}
    supabase:
      url: ${SUPABASE_URL:}
      service-key: ${SUPABASE_SERVICE_KEY:}
      bucket: ${SUPABASE_BUCKET:fams-files}
  jwt:
    # Must be at least 32 characters. Always override JWT_SECRET outside local development.
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  issue-order:
    # The first number the system issues when it has none yet. Set it to the OPC's next paper IO number.
    first-number: ${IO_FIRST_NUMBER:1804332}
    # Printed under "Approved by". Leave empty to print only the title.
    property-custodian-name: ${PROPERTY_CUSTODIAN_NAME:}
    institution: ${INSTITUTION_NAME:CEBU INSTITUTE OF TECHNOLOGY - UNIVERSITY}
  ocr:
    # Folder with <language>.traineddata. Empty: the Docker image's Tesseract, else ./tessdata.
    tessdata: ${OCR_TESSDATA:}
    language: ${OCR_LANGUAGE:eng}
  bootstrap-admin:
    # Creates the first Administrator only when the app_user table is empty.
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:System Administrator}
